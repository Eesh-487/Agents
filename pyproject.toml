[project]
name = "compliance-memory-system"
version = "0.1.0"
requires-python = ">=3.12"
# Direct dependencies only - exact versions of everything (including
# transitive packages) are pinned in uv.lock.
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "fastembed>=0.9.0",
    "json-repair>=0.62.0",
    "langgraph>=1.2.2",
    # Local LLM backend; Apple Silicon only. Elsewhere the LLM is a hosted API.
    "mlx-lm>=0.28.0; sys_platform == 'darwin'",
    "neo4j>=6.2.0",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
